# Static site (no build step). Hash-routed SPA: index.html handles every route.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # The interview uses the microphone for speech-to-text.
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA fallback: any path that isn't a real file serves index.html (status 200), so a refresh or a shared
# deep link never 404s; index.html then converts the path into its hash route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
