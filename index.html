<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interview IQ — Free AI Interview Simulator</title>
<meta name="description" content="Free, voice-enabled AI interview simulator. Practice the AI screening interviews used by Outlier, Mercor, and Micro1 across every profession. No sign-up, no API key." />
<style>
  :root{
    --bg:#0a0f1c; --bg2:#0e1626; --panel:#121c30; --panel2:#172339;
    --line:#243450; --line2:#314a73;
    --txt:#eaf2ff; --muted:#9bb0d0; --faint:#6c809f;
    /* Ocean Blue theme (overridable at runtime) */
    --brand:#2b74f0; --brand2:#15a9d6; --accent:#13c4c4;
    --good:#22c55e; --ok:#eab308; --bad:#ef4444;
    --shadow:0 18px 50px rgba(0,0,0,.45);
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 72% -10%,#11254a 0%,var(--bg) 55%) fixed;
    color:var(--txt); line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  a{color:var(--brand)}
  .wrap{max-width:980px;margin:0 auto;padding:28px 18px 80px}
  .row{display:flex;gap:14px}
  .between{justify-content:space-between;align-items:center}
  .center{align-items:center}
  .wrapw{flex-wrap:wrap}
  .grow{flex:1}
  .muted{color:var(--muted)}.faint{color:var(--faint)}
  .small{font-size:13px}
  .hidden{display:none!important}

  header.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;min-height:52px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.2px;font-size:18px}
  .logo .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;
    background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 6px 18px rgba(43,116,240,.35)}
  .logo img{height:48px;width:48px;object-fit:cover;border-radius:12px;display:none;flex:0 0 auto;
    box-shadow:0 0 0 1px rgba(255,255,255,.07),0 4px 12px rgba(0,0,0,.35)}
  .logo .mark{flex:0 0 auto}
  .brandText{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .brandName2{font-weight:800;font-size:18px;letter-spacing:.2px}
  .brandSub{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.2px;white-space:nowrap}
  @media(max-width:460px){.brandSub{font-size:10.5px;white-space:normal}}
  .barRight{display:flex;align-items:center;gap:10px}
  .pill{font-size:12px;font-weight:600;color:var(--accent);border:1px solid var(--line2);
    background:rgba(19,196,196,.08);padding:5px 11px;border-radius:999px}
  .iconbtn{appearance:none;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);
    width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;line-height:1}
  .iconbtn:hover{border-color:var(--brand);color:var(--txt)}

  .card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
    border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
  .card+.card{margin-top:18px}
  h1{font-size:34px;line-height:1.15;margin:6px 0 10px;letter-spacing:-.5px}
  h2{font-size:20px;margin:0 0 14px}
  h3{font-size:15px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  p{margin:0 0 12px}

  .btn{appearance:none;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);
    font-size:15px;font-weight:600;padding:12px 20px;border-radius:12px;cursor:pointer;
    transition:transform .08s ease,border-color .15s ease,background .15s ease}
  .btn:hover{border-color:var(--brand);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border:none;
    box-shadow:0 10px 26px rgba(43,116,240,.32)}
  .btn.ghost{background:transparent}
  .btn.danger{border-color:#5b2330;background:rgba(239,68,68,.12);color:#ffb4b4}
  .btn.good{border-color:#1f5135;background:rgba(34,197,94,.14);color:#9ef0bf}
  .btn.lg{font-size:16px;padding:15px 26px}
  .btn.block{width:100%;justify-content:center;display:flex}

  .opts{display:flex;flex-wrap:wrap;gap:10px}
  .opt{border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:13px 15px;
    cursor:pointer;min-width:130px;flex:1;transition:.15s}
  .opt:hover{border-color:var(--brand)}
  .opt.sel{border-color:var(--brand);background:rgba(43,116,240,.16);box-shadow:0 0 0 1px var(--brand) inset}
  .opt .t{font-weight:700;font-size:14px}
  .opt .d{font-size:12px;color:var(--muted);margin-top:2px}

  select,input,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);
    border-radius:11px;padding:12px 13px;font-size:15px;font-family:inherit}
  textarea{min-height:120px;resize:vertical;line-height:1.6}
  label.fld{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
  .field+.field{margin-top:18px}

  @media(max-width:680px){h1{font-size:27px}.wrap{padding-top:22px}}
  @media(max-width:460px){.logo{font-size:16px}.pill{display:none}}

  .stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 4px}
  .orb{position:relative;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;margin:4px 0 14px;
    background:radial-gradient(circle at 35% 30%,#cfe0ff,var(--brand) 45%,var(--brand2) 100%);
    box-shadow:0 0 0 10px rgba(43,116,240,.08),0 0 60px rgba(21,169,214,.45)}
  .orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(43,116,240,.25)}
  .orb .face{font-size:48px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
  .orb.speaking{animation:pulse 1.1s ease-in-out infinite}
  .orb.listening{background:radial-gradient(circle at 35% 30%,#b8f5ea,var(--accent) 45%,#0ea5e9 100%);
    box-shadow:0 0 0 10px rgba(19,196,196,.10),0 0 60px rgba(19,196,196,.5)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .eq{display:flex;gap:4px;height:22px;align-items:flex-end;margin-top:2px}
  .eq span{width:4px;background:var(--accent);border-radius:3px;height:6px}
  .orb.listening ~ .eq span{animation:eq .9s ease-in-out infinite}
  .eq span:nth-child(2){animation-delay:.1s}.eq span:nth-child(3){animation-delay:.2s}
  .eq span:nth-child(4){animation-delay:.3s}.eq span:nth-child(5){animation-delay:.15s}
  @keyframes eq{0%,100%{height:6px}50%{height:22px}}

  .status{font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--accent)}
  .greet{font-size:14px;color:#cfe0ff;background:rgba(43,116,240,.1);border:1px solid var(--line2);
    border-radius:12px;padding:10px 14px;margin:2px 0 12px}
  .qbox{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:6px 0 14px;text-align:left}
  .qmeta{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:6px}
  .qtext{font-size:18px;font-weight:600}
  .followup{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2);color:#cdd7f5;font-size:15px}

  .transcript{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:14px;min-height:84px;text-align:left;font-size:15px}
  .transcript .interim{color:var(--faint)}
  .transcript.empty{color:var(--faint);font-style:italic}

  .progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .4s}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
  .timer.warn{color:var(--ok)}.timer.over{color:var(--bad)}

  .scorebig{font-size:60px;font-weight:800;line-height:1;letter-spacing:-1px}
  .ring{--p:0;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
  .ring>div{width:112px;height:112px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
  .dim{margin:10px 0}.dim .between{margin-bottom:5px}
  .bar{height:9px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;border-radius:99px}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid var(--line2)}
  .badge.good{color:#9ef0bf;border-color:#1f5135;background:rgba(34,197,94,.12)}
  .badge.ok{color:#ffe08a;border-color:#5a4a16;background:rgba(234,179,8,.12)}
  .badge.bad{color:#ffb4b4;border-color:#5b2330;background:rgba(239,68,68,.12)}
  .qresult{border:1px solid var(--line);border-radius:13px;padding:16px;margin-top:12px;background:var(--bg2)}
  ul.tips{margin:6px 0 0;padding-left:18px}ul.tips li{margin:4px 0}
  .note{font-size:13px;color:var(--faint);margin-top:14px}

  .overlay{position:fixed;inset:0;background:rgba(4,8,18,.66);display:grid;place-items:center;padding:18px;z-index:50}
  .modal{max-width:540px;width:100%;max-height:90vh;overflow:auto}
  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="logo" id="logoWrap">
      <img id="brandLogo" alt="BSP logo" />
      <span class="mark" id="brandMark">◆</span>
      <span class="brandText"><span id="brandName">Interview IQ</span><span class="brandSub" id="brandSub">by BSP · Business Startup Powerhouse</span></span>
    </div>
    <div class="barRight">
      <span class="pill" id="freePill">100% free • no sign-up</span>
    </div>
  </header>
  <main id="app"></main>
  <footer id="footer"></footer>
</div>

<script>
"use strict";
/* ============================================================================
   Interview IQ — single-file AI interview simulator
   Voice via browser Web Speech API · built-in adaptive engine + rubric scorer
   No backend, no API keys, nothing leaves the browser.
   ========================================================================== */

/* ---------- Branding — permanently baked in for the BSP community ------------ */
const BRAND = {
  name:"Interview IQ",
  community:"BSP · Business Startup Powerhouse",
  tagline:"Pass the AI interview gate. Practice it free, out loud.",
  emoji:"◆",
};
function renderBrand(){
  document.title = BRAND.name + " — by BSP · Free AI Interview Simulator";
  const nm=document.getElementById("brandName"); if(nm) nm.textContent=BRAND.name;
  const sub=document.getElementById("brandSub"); if(sub) sub.textContent="by "+BRAND.community;
  const mk=document.getElementById("brandMark"); if(mk) mk.textContent=BRAND.emoji;
  // Header logo: try logo.png (drop in your exact BSP image), then logo.svg, then emoji.
  const img=document.getElementById("brandLogo");
  if(img){
    img.onload=()=>{ img.style.display="inline-block"; if(mk) mk.style.display="none"; };
    img.onerror=function(){
      if(img.getAttribute("data-fallback")!=="1"){ img.setAttribute("data-fallback","1"); img.src="logo.svg"; }
      else { img.style.display="none"; if(mk) mk.style.display="grid"; }
    };
    img.src="logo.png?"+Date.now();
  }
}

/* ---------- Reference platforms (for the candidate intro) ------------------- */
const PLATFORMS = { outlier:"Outlier", mercor:"Mercor", micro1:"Micro1", other:"your target platform" };

/* ---------- Question bank ---------------------------------------------------- */
const CORE = [
  { q:"Tell me about your background and what makes you a strong fit to train and evaluate AI models in your field.",
    concepts:["experience","years","expertise","domain","project","skill","education","background","worked","specialized"],
    hint:"specific experience, concrete projects, and how your expertise maps to evaluating model outputs" },
  { q:"AI training work means following detailed, sometimes strict instructions exactly. Describe how you handle complex multi-step guidelines, and what you do when an instruction is ambiguous.",
    concepts:["read","clarify","re-read","examples","ask","assume","reasonable","document","consistent","guideline","edge case"],
    hint:"careful reading, seeking clarification, documenting assumptions, and staying consistent" },
  { q:"You're given a model's answer that looks fluent and confident but is subtly wrong. Walk me through, step by step, how you would identify the error and rate the response.",
    concepts:["verify","fact","check","source","reasoning","step","evidence","logic","wrong","rubric","compare","hallucination"],
    hint:"verifying claims against evidence, checking the reasoning chain, not trusting fluency" },
  { q:"Why do quality and consistency matter so much in data-labeling and model-evaluation work, and how do you keep your own quality high over a long session?",
    concepts:["quality","consistent","model","training","downstream","mistake","break","focus","double-check","rubric","reliable","accuracy"],
    hint:"awareness that labels shape the model, plus concrete habits for sustained accuracy" },
  { q:"Tell me about a time you received critical feedback on your work. How did you respond, and what changed afterward?",
    concepts:["feedback","learned","changed","improved","listened","applied","mistake","better","adjusted","growth","took"],
    hint:"genuine receptiveness, a concrete change you made, and a better outcome" },
  { q:"A new teammate thinks 'close enough' is fine when labeling data. In a few sentences, explain why following the guidelines exactly actually matters.",
    concepts:["consistent","guideline","exactly","model","quality","downstream","example","standard","ambiguous","reliable","compound"],
    hint:"persuasive, structured, with a concrete consequence of sloppy labels compounding in the model" },
];

const DOMAINS = {
  general: { label:"General / Any field", icon:"🧭", q:[
    { q:"Explain a complex idea from your area of expertise to a smart person who has zero background in it. Keep it accurate but accessible.",
      concepts:["because","example","analogy","simple","means","works","imagine","like","so that"],
      hint:"a clear analogy, plain language, and no loss of accuracy" },
    { q:"Describe a time you caught a mistake others missed. What was the mistake, how did you find it, and what was the impact?",
      concepts:["mistake","noticed","checked","data","result","fixed","impact","because","realized","attention"],
      hint:"a concrete situation, your detection process, and the measurable outcome" },
    { q:"How do you stay objective when you have a gut feeling that an answer is wrong but can't immediately prove it?",
      concepts:["evidence","verify","check","source","reasoning","bias","test","document","systematic","confirm"],
      hint:"converting intuition into a verifiable check rather than trusting the gut alone" },
    { q:"Walk me through how you'd break an unfamiliar task you've never done before into manageable steps.",
      concepts:["break down","steps","research","plan","smaller","prioritize","unknown","approach","first","clarify"],
      hint:"a systematic decomposition: clarify the goal, research, break into steps, and prioritize" },
    { q:"How do you decide when an answer is 'good enough' versus when it needs more work?",
      concepts:["criteria","rubric","requirements","diminishing","quality","standard","enough","time","tradeoff","check"],
      hint:"explicit quality criteria and balancing thoroughness against diminishing returns" },
    { q:"Describe how you'd give constructive feedback on work that has both real strengths and clear flaws.",
      concepts:["specific","strength","weakness","actionable","example","balanced","improve","respectful","evidence","suggest"],
      hint:"balanced, specific, actionable feedback grounded in examples" },
  ]},
  software: { label:"Software / Engineering", icon:"💻", q:[
    { q:"Two functions return the same output but one is far better. What dimensions do you evaluate to decide which code is 'better', and why?",
      concepts:["readability","complexity","time","space","big-o","edge case","maintainability","test","performance","security","clarity"],
      hint:"correctness, complexity, readability, edge cases, and maintainability — not just 'it works'" },
    { q:"You must rate two AI-generated solutions to a coding prompt. The first is shorter; the second handles edge cases. How do you decide, and what would change your ranking?",
      concepts:["correct","edge case","requirements","test","tradeoff","prompt","instructions","robust","fail","input"],
      hint:"grounding the judgment in the prompt's requirements and correctness over brevity" },
    { q:"Explain the difference between a stack and a queue, and give one real situation where choosing the wrong one causes a bug.",
      concepts:["lifo","fifo","order","push","pop","stack","queue","example","first","last"],
      hint:"LIFO vs FIFO clearly stated, plus a concrete failure case" },
    { q:"How would you evaluate whether AI-generated code is secure? Name concrete things you'd check.",
      concepts:["injection","validation","sanitize","secret","authentication","authorization","dependency","overflow","input","vulnerability"],
      hint:"input validation, injection, secrets handling, auth, and dependency risks" },
    { q:"Explain time and space complexity (Big-O) to a beginner, and why it matters when comparing two solutions.",
      concepts:["big-o","time","space","scale","input","growth","efficient","worst case","example","memory"],
      hint:"how runtime and memory grow with input size, with a concrete comparison" },
    { q:"You're rating an AI's debugging explanation. What separates a real root-cause analysis from a guess?",
      concepts:["reproduce","root cause","evidence","hypothesis","test","logs","systematic","verify","guess","isolate"],
      hint:"reproducing the bug and isolating the cause with evidence, not guessing" },
  ]},
  data_ai: { label:"Data Science / ML / AI", icon:"📊", q:[
    { q:"A model scores 98% accuracy but performs terribly in production. Give the most likely reasons and how you'd investigate.",
      concepts:["imbalance","overfit","data leak","distribution","shift","baseline","precision","recall","test set","bias","generalize"],
      hint:"class imbalance, leakage, train/serve skew, and the right metrics beyond accuracy" },
    { q:"When rating two model responses for 'helpfulness', how do you keep your judgments objective and consistent across hundreds of comparisons?",
      concepts:["rubric","criteria","consistent","bias","define","anchor","compare","calibrate","guideline","note"],
      hint:"a written rubric, calibration anchors, and guarding against fatigue/bias" },
    { q:"What is overfitting, and how would you explain to a non-technical reviewer why a 'perfect' training score can be a red flag?",
      concepts:["memorize","generalize","training","unseen","validation","red flag","noise","pattern","new data"],
      hint:"memorization vs generalization, and why unseen-data performance is what matters" },
    { q:"What is data leakage, and why can it make a model look great in testing but fail in the real world?",
      concepts:["leakage","future","target","train","test","contaminate","feature","unrealistic","optimistic","split"],
      hint:"information from the target or future leaking into training inflates test scores" },
    { q:"When is accuracy a misleading metric, and what would you use instead?",
      concepts:["imbalance","precision","recall","f1","accuracy","rare","class","auc","misleading","positive"],
      hint:"class imbalance makes accuracy misleading; precision, recall, F1, and AUC are better" },
    { q:"How do you evaluate whether an AI's answer is biased or unfair, and why does that matter in training data?",
      concepts:["bias","fairness","group","representation","stereotype","harm","balanced","sensitive","example","propagate"],
      hint:"spotting skew or stereotypes and recognizing labels propagate bias into the model" },
  ]},
  math: { label:"Mathematics", icon:"➗", q:[
    { q:"A student insists 0.999... is strictly less than 1. Walk through how you'd convince them otherwise, rigorously.",
      concepts:["limit","sum","geometric","equal","proof","1/3","algebra","infinite","series","because"],
      hint:"a real proof (algebraic or limit-based), not just assertion" },
    { q:"You're checking an AI's step-by-step solution to a calculus problem. The final answer is right but a middle step is wrong. How do you rate it and why does the middle step matter?",
      concepts:["reasoning","step","verify","luck","wrong","process","correct","partial","derivative","integral","rubric"],
      hint:"valuing correct reasoning, not just the final number — a right answer via wrong steps is a fail" },
    { q:"Explain the difference between correlation and causation using a concrete example, as you might when rating a data-analysis answer.",
      concepts:["correlation","causation","confound","variable","cause","example","spurious","relationship","because","third"],
      hint:"a clean example plus the role of confounders" },
    { q:"How would you check whether a proof is actually valid versus just convincing-sounding?",
      concepts:["assumption","step","logic","gap","counterexample","rigor","follow","valid","justify","each"],
      hint:"each step must follow rigorously; look for unjustified jumps and counterexamples" },
    { q:"Explain the difference between necessary and sufficient conditions with an example.",
      concepts:["necessary","sufficient","condition","example","implies","if","only if","both","logic","requirement"],
      hint:"clear definitions and a clean example distinguishing the two" },
    { q:"An AI gives a probability answer that 'feels' wrong. How would you sanity-check it?",
      concepts:["bounds","sum","total","estimate","expected","check","intuition","sanity","probability","range"],
      hint:"checking bounds (0 to 1), totals summing to 1, and rough expected values" },
  ]},
  physics: { label:"Physics", icon:"🔭", q:[
    { q:"Explain why a feather and a hammer fall at the same rate in a vacuum, and what changes on Earth.",
      concepts:["gravity","acceleration","mass","air resistance","drag","vacuum","equal","force","9.8","independent"],
      hint:"acceleration independent of mass; air resistance as the Earth-side difference" },
    { q:"An AI explains a physics concept using a confident but physically impossible analogy. How do you catch this and what's your feedback?",
      concepts:["conserve","energy","law","impossible","check","units","reasoning","violate","physical","feedback"],
      hint:"checking against conservation laws/units and giving specific corrective feedback" },
    { q:"Why are units and dimensional analysis a fast way to catch an error in a physics answer? Give an example.",
      concepts:["units","dimension","analysis","check","mismatch","example","velocity","meters","seconds","consistent"],
      hint:"dimensional consistency as a quick sanity check, illustrated concretely" },
    { q:"Explain the difference between speed and velocity, and why the distinction can change an answer's correctness.",
      concepts:["speed","velocity","direction","vector","scalar","magnitude","example","displacement","matters","sign"],
      hint:"scalar vs vector, and how direction changes the result" },
    { q:"How would you spot when an AI's physics answer violates conservation of energy or momentum?",
      concepts:["conserve","energy","momentum","before","after","equal","closed","system","check","violate"],
      hint:"comparing before and after in a closed system against the conservation laws" },
    { q:"Why are order-of-magnitude (Fermi) estimates useful for catching wrong answers?",
      concepts:["estimate","magnitude","fermi","approximate","reasonable","ballpark","sanity","off","check","scale"],
      hint:"a rough ballpark quickly flags answers that are wildly off" },
  ]},
  chemistry: { label:"Chemistry", icon:"⚗️", q:[
    { q:"Explain the difference between an exothermic and endothermic reaction with a real example of each.",
      concepts:["heat","release","absorb","energy","example","combustion","temperature","surroundings","bond"],
      hint:"energy direction defined plus a correct concrete example of each" },
    { q:"You must evaluate an AI's safety guidance for a lab procedure. What would make you rate it unsafe, and how careful must you be?",
      concepts:["safety","hazard","ppe","ventilation","concentration","reaction","incorrect","danger","verify","precaution"],
      hint:"naming concrete hazards and treating safety errors as critical failures" },
    { q:"Why is balancing a chemical equation non-negotiable, and how would you spot an unbalanced one in an AI answer?",
      concepts:["balance","conservation","mass","atoms","coefficient","reactant","product","equal","check","both sides"],
      hint:"conservation of mass and a quick atom-count check on both sides" },
    { q:"Explain the difference between an acid and a base, and how you'd verify an AI's pH claim.",
      concepts:["acid","base","ph","proton","hydrogen","scale","neutral","seven","verify","example"],
      hint:"proton donor vs acceptor, the pH scale, and a quick correctness check" },
    { q:"Why does stoichiometry matter when judging whether a reaction answer is correct?",
      concepts:["stoichiometry","ratio","mole","reactant","product","balance","limiting","amount","calculate","proportion"],

/* ---------- Speech ----------------------------------------------------------- */
const Speech = (()=>{
  const synth = window.speechSynthesis || null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let voice=null;
  function pickVoice(){
    if(!synth) return;
    const vs=synth.getVoices();
    voice = vs.find(v=>/en[-_]US/i.test(v.lang)&&/female|samantha|google us/i.test(v.name))
         || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || vs[0] || null;
  }
  if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
  return {
    ttsAvailable:!!synth, sttAvailable:!!SR, SR,
    speak(text){ return new Promise(res=>{
      if(!synth){ res(); return; }
      try{ synth.cancel(); }catch(e){}
      const u=new SpeechSynthesisUtterance(text);
      if(voice) u.voice=voice; u.rate=1.02; u.pitch=1.0;
      u.onend=()=>res(); u.onerror=()=>res(); synth.speak(u);
    }); },
    stop(){ try{ synth&&synth.cancel(); }catch(e){} }
  };
})();

/* ---------- Scoring ---------------------------------------------------------- */
const STRUCT=["because","therefore","first","second","third","then","however","for example","such as","in addition","as a result","so that","which means","on the other hand","finally"];
function words(s){ return (s.trim().match(/[A-Za-z0-9’'-]+/g)||[]); }
function scoreAnswer(answer, q, mult){
  const text=(answer||"").toLowerCase(), wc=words(answer).length;
  const hits=q.concepts.filter(c=>text.includes(c.toLowerCase()));
  const coverage=q.concepts.length? hits.length/q.concepts.length : 0;
  const depth = wc>=130?1 : wc>=90?.86 : wc>=60?.7 : wc>=35?.5 : wc>=18?.3 : wc>=6?.12 : 0;
  const structHits=STRUCT.filter(s=>text.includes(s)).length;
  const structure=Math.min(1, structHits/3);
  const nums=(answer.match(/\b\d+(\.\d+)?%?\b/g)||[]).length;
  const example=/for example|for instance|e\.g\.|such as|i once|in my|a time when|i worked|i built/i.test(answer)?1:0;
  const uniq=new Set(words(text)).size;
  const specificity=Math.min(1, nums*0.22 + example*0.5 + Math.min(1,uniq/55)*0.5);
  let raw = coverage*0.40 + depth*0.25 + structure*0.20 + specificity*0.15;
  raw = Math.max(0, Math.min(1, raw*mult));
  return { score:Math.round(raw*100), wc,
    dims:{ Relevance:Math.round(coverage*100), Depth:Math.round(depth*100), Structure:Math.round(structure*100), Specificity:Math.round(specificity*100) },
    missed:q.concepts.filter(c=>!text.includes(c.toLowerCase())), hit:hits };
}
function band(s){ return s>=78?["good","Strong"] : s>=55?["ok","Adequate"] : ["bad","Needs work"]; }
function feedbackFor(r,q){
  const tips=[];
  if(r.wc<30) tips.push("Your answer was short. Aim for 60–120 words — interviewers read brevity as shallow knowledge.");
  if(r.dims.Relevance<60) tips.push("Cover more of what the question targets — a strong answer here would touch on: "+q.concepts.slice(0,6).join(", ")+".");
  if(r.dims.Structure<50) tips.push("Signpost your reasoning ('first… because… for example… therefore…') so it's easy to follow.");
  if(r.dims.Specificity<50) tips.push("Add a concrete example, number, or real situation — specifics separate experts from generalists.");
  if(!tips.length) tips.push("Solid, well-rounded answer. To go further, add a measurable outcome or edge case.");
  tips.push("What a top answer demonstrates: "+q.hint+".");
  return tips;
}

function buildQuestions(){
  const dq=(DOMAINS[App.cfg.domain]?.q)||[];
  const restCore=CORE.slice(1);
  // Lead with the intro question, then interleave domain + core for a natural mix.
  const seq=[]; const maxLen=Math.max(dq.length, restCore.length);
  for(let i=0;i<maxLen;i++){ if(i<dq.length) seq.push(dq[i]); if(i<restCore.length) seq.push(restCore[i]); }
  const ordered=[CORE[0], ...seq];
  App.questions=ordered.slice(0, App.cfg.count);
}

    <div class="field"><h3>Which platform are you prepping for?</h3><div class="opts">${plat}</div></div>
    <div class="field"><h3>How much experience do you have?</h3>
      <div class="opts">${levels.map(([k,t,d])=>`<div class="opt ${c.level===k?'sel':''}" onclick="setLevel('${k}')"><div class="t">${t}</div><div class="d">${d}</div></div>`).join("")}</div>
    </div>
    <div class="row" style="margin-top:20px"><button class="btn primary lg block" onclick="go('setup')">Continue →</button></div>
  </div>`;
  setTimeout(()=>{const n=document.getElementById('candName'); if(n&&!c.name) n.focus();},60);
}

function scrSetup(){
  const d=App.cfg;
  const domainOpts=Object.entries(DOMAINS).map(([k,v])=>
    `<div class="opt ${d.domain===k?'sel':''}" onclick="setDomain('${k}')"><div class="t">${v.icon} ${H(v.label)}</div></div>`).join("");
  const diffOpts=Object.entries(DIFFICULTY).map(([k,v])=>
    `<div class="opt ${d.difficulty===k?'sel':''}" onclick="setDiff('${k}')"><div class="t">${H(v.label)}</div><div class="d">${H(v.d)}</div></div>`).join("");
  el.innerHTML=`
  <div class="card">
    <div class="row between center"><h2 style="margin:0">Set up your interview</h2><button class="btn ghost" onclick="go('intro')">← Back</button></div>
    ${App.candidate.name?`<p class="muted">Ready when you are, <b>${H(App.candidate.name)}</b>.</p>`:""}
    <div class="field"><h3>1 · Profession track</h3><div class="opts">${domainOpts}</div></div>
    <div class="field"><h3>2 · Difficulty</h3><div class="opts">${diffOpts}</div></div>
    <div class="field"><h3>3 · Length</h3>
      <div class="opts">${[4,6,8,12].map(n=>`<div class="opt ${d.count===n?'sel':''}" onclick="setCount(${n})"><div class="t">${n} questions${n===12?' · full':''}</div><div class="d">≈ ${Math.round(n*2.5)} min</div></div>`).join("")}</div>
    </div>
    <div class="field"><h3>4 · Voice</h3>
      <div class="opts">
        <div class="opt ${d.voice?'sel':''}" onclick="setVoice(true)"><div class="t">🔊 Interviewer speaks</div><div class="d">Hear questions aloud</div></div>
        <div class="opt ${!d.voice?'sel':''}" onclick="setVoice(false)"><div class="t">🔇 Text only</div><div class="d">Read questions silently</div></div>
      </div>
      ${!Speech.ttsAvailable?`<div class="note">Text-to-speech isn't available in this browser; questions will show as text.</div>`:""}
    </div>
    <div class="row" style="margin-top:20px"><button class="btn primary lg block" onclick="startInterview()">Begin interview →</button></div>
  </div>`;
}

/* ---- Interview ---- */
let recog=null, listening=false, finalText="", interimText="", tick=null, elapsed=0, followUsed=false;

function greeting(){
  const n=App.candidate.name?(" "+App.candidate.name):"";
  const p=PLATFORMS[App.candidate.platform]||"your target platform";
  const plabel = App.candidate.platform==='other' ? "an AI data-work" : ("the "+p);
  return `Hi${n}, thanks for joining. I'll ask you ${App.questions.length} questions for ${plabel} screening. Take your time, structure your answers, and give concrete examples. Let's begin.`;
}

function scrInterview(){
  const q=App.questions[App.idx], dom=DOMAINS[App.cfg.domain];
  const pct=Math.round((App.idx)/App.questions.length*100);
  const first=App.idx===0;
  el.innerHTML=`
  <div class="card">
    <div class="row between center small muted">
      <span>${dom.icon} ${H(dom.label)} · ${H(DIFFICULTY[App.cfg.difficulty].label)}</span>
      <span class="timer" id="timer">0:00</span>
    </div>
    <div class="progress" style="margin:10px 0 4px"><i style="width:${pct}%"></i></div>
    <div class="small faint">Question ${App.idx+1} of ${App.questions.length}</div>
    <div class="stage">
      <div class="orb" id="orb"><span class="face">🤖</span></div>
      <div class="eq" id="eq" style="visibility:hidden"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="status" id="status">Preparing…</div>
    </div>
    ${first&&App.candidate.name?`<div class="greet">👋 Hi ${H(App.candidate.name)} — welcome. Here's your first question.</div>`:""}
    <div class="qbox">
      <div class="qmeta">Interviewer asks</div>
      <div class="qtext">${H(q.q)}</div>
      <div class="followup hidden" id="followup"></div>
    </div>
    <div id="answerArea">
      ${Speech.sttAvailable?`
        <div class="transcript empty" id="transcript">Your spoken answer will appear here…</div>
        <div class="row wrapw" style="margin-top:12px">
          <button class="btn good" id="micBtn" onclick="toggleMic()" disabled>🎙️ Start answering</button>
          <button class="btn ghost" onclick="repeatQ()">🔁 Repeat question</button>
          <button class="btn ghost" id="typeToggle" onclick="showTyping()">⌨️ Type instead</button>
        </div>
        <textarea id="typeBox" class="hidden" placeholder="Type your answer here…" style="margin-top:12px"></textarea>
      `:`
        <textarea id="typeBox" placeholder="Type your full answer here…"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn ghost" onclick="repeatQ()">🔁 Repeat question</button></div>
      `}
    </div>
    <div class="row between" style="margin-top:18px">
      <button class="btn ghost" onclick="quitConfirm()">End early</button>
      <button class="btn primary" id="nextBtn" onclick="submitAnswer()">${App.idx+1<App.questions.length?'Submit & next →':'Submit & finish →'}</button>
    </div>
    <div class="note">Tip: speak for 45–90 seconds. Structure your answer and give a concrete example.</div>
  </div>`;
  finalText=""; interimText=""; elapsed=0; followUsed=false;
  setStatus("Preparing…");
  askQuestion(q.q, first?greeting():null);
}

function setStatus(t){ const s=document.getElementById("status"); if(s) s.textContent=t; }
function orbMode(m){
  const orb=document.getElementById("orb"), eq=document.getElementById("eq"); if(!orb) return;
  orb.classList.remove("speaking","listening"); if(eq) eq.style.visibility="hidden";
  if(m==="speaking") orb.classList.add("speaking");
  if(m==="listening"){ orb.classList.add("listening"); if(eq) eq.style.visibility="visible"; }
}
async function askQuestion(text, prefix){
  orbMode("speaking"); setStatus("Speaking…");
  if(App.cfg.voice && Speech.ttsAvailable){ if(prefix) await Speech.speak(prefix); await Speech.speak(text); }
  orbMode("idle"); setStatus(Speech.sttAvailable?"Your turn — press “Start answering”":"Your turn — type your answer");
  startTimer();
  const mic=document.getElementById("micBtn"); if(mic) mic.disabled=false;
}
function repeatQ(){ Speech.stop(); askQuestion(App.questions[App.idx].q); }
function startTimer(){
  clearInterval(tick);
  const limit=DIFFICULTY[App.cfg.difficulty].time;
  tick=setInterval(()=>{ elapsed++;
    const t=document.getElementById("timer");
    if(t){ const m=Math.floor(elapsed/60), s=String(elapsed%60).padStart(2,"0");
      t.textContent=`${m}:${s}`; t.className="timer"+(elapsed>limit?" over":elapsed>limit*0.75?" warn":""); }
  },1000);
}

function toggleMic(){ if(!listening) startMic(); else stopMic(); }
function startMic(){
  if(!Speech.SR) return;
  recog=new Speech.SR(); recog.lang="en-US"; recog.continuous=true; recog.interimResults=true;
  recog.onresult=(e)=>{ interimText="";
    for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i];
      if(r.isFinal) finalText+=(finalText?" ":"")+r[0].transcript.trim(); else interimText+=r[0].transcript; }
    paintTranscript(); maybeFollowUp(); };
  recog.onend=()=>{ if(listening){ try{ recog.start(); }catch(e){} } };
  recog.onerror=(e)=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed") micDenied(); };
  try{ recog.start(); }catch(e){}
  listening=true; orbMode("listening"); setStatus("Listening…");
  const b=document.getElementById("micBtn"); if(b){ b.textContent="⏹ Stop answering"; b.classList.remove("good"); b.classList.add("danger"); }
}
function stopMic(){
  listening=false; try{ recog&&recog.stop(); }catch(e){}
  orbMode("idle"); setStatus("Answer captured — submit when ready");
  const b=document.getElementById("micBtn"); if(b){ b.textContent="🎙️ Resume answering"; b.classList.add("good"); b.classList.remove("danger"); }
}
function micDenied(){ listening=false; setStatus("Microphone blocked — switch to typing");
  const ta=document.getElementById("typeBox"); if(ta) ta.classList.remove("hidden");
  const tr=document.getElementById("transcript"); if(tr) tr.classList.add("hidden"); }
function paintTranscript(){
  const tr=document.getElementById("transcript"); if(!tr) return;
  const full=(finalText+" "+interimText).trim();
  if(!full){ tr.classList.add("empty"); tr.textContent="Your spoken answer will appear here…"; return; }
  tr.classList.remove("empty"); tr.innerHTML=H(finalText)+(interimText?` <span class="interim">${H(interimText)}</span>`:""); }
function showTyping(){ const ta=document.getElementById("typeBox"); if(ta){ ta.classList.toggle("hidden"); if(!ta.classList.contains("hidden")) ta.focus(); } }

const FOLLOWUPS=["Could you give a specific example from your own experience?","Can you walk me through your reasoning step by step?","What would change your approach in a harder edge case?","Why does that matter for the quality of the trained model?"];
function maybeFollowUp(){
  if(followUsed) return;
  const wc=words(finalText).length;
  if(wc>=10 && wc<28){ followUsed=true;
    const f=FOLLOWUPS[App.idx % FOLLOWUPS.length], fu=document.getElementById("followup");
    if(fu){ fu.classList.remove("hidden"); fu.innerHTML="↳ <b>Follow-up:</b> "+H(f); }
    if(App.cfg.voice && Speech.ttsAvailable) Speech.speak(f); }
}
function currentAnswerText(){
  const ta=document.getElementById("typeBox");
  const typed=ta && !ta.classList.contains("hidden") ? ta.value.trim() : "";
  return [finalText.trim(), typed].filter(Boolean).join(" ").trim();
}
function submitAnswer(){
  const ans=currentAnswerText();
  if(words(ans).length<3){ setStatus("Please give a fuller answer before submitting");
    const nb=document.getElementById("nextBtn"); if(nb){ nb.classList.add("danger"); setTimeout(()=>nb.classList.remove("danger"),1200); } return; }
  stopMic(); Speech.stop(); clearInterval(tick);
  const q=App.questions[App.idx], r=scoreAnswer(ans, q, DIFFICULTY[App.cfg.difficulty].mult);
  App.answers.push({ q:q.q, hint:q.hint, answer:ans, seconds:elapsed, ...r, feedback:feedbackFor(r,q) });
  if(App.idx+1<App.questions.length){ App.idx++; scrInterview(); } else finishInterview();
}
function quitConfirm(){ if(App.answers.length===0){ go('welcome'); return; }
  if(confirm("End the interview now and see your report for the questions you've answered?")) finishInterview(); }
function finishInterview(){ stopMic(); Speech.stop(); clearInterval(tick); App.screen="results"; saveHistory(); render(); }

/* ---- Results ---- */
function overall(){ if(!App.answers.length) return 0; return Math.round(App.answers.reduce((a,b)=>a+b.score,0)/App.answers.length); }
function avgDim(name){ const xs=App.answers.map(a=>a.dims[name]); return Math.round(xs.reduce((a,b)=>a+b,0)/xs.length); }
function barColor(v){ return v>=78?"var(--good)":v>=55?"var(--ok)":"var(--bad)"; }
function scrResults(){
  const sc=overall(); const [bk,bl]=band(sc); const dims=["Relevance","Depth","Structure","Specificity"];
  const nm=App.candidate.name, plat=PLATFORMS[App.candidate.platform]||"your target platform";
  const verdict = sc>=78?`${nm?nm+", you":"You"}'re interview-ready. This is the level platforms look for — keep it consistent.`
    : sc>=55?`${nm?nm+", you":"You"}'re close. Tighten the weak areas below and you'll clear most screening gates.`
    : `Good start${nm?", "+nm:""} — but you'd likely be filtered here. Work the fixes below and run it again.`;
  el.innerHTML=`
  <div class="card">
    <div class="row between center"><h2 style="margin:0">${nm?H(nm)+"'s ":""}interview report</h2><span class="badge ${bk}">${bl}</span></div>
    <div class="row center wrapw" style="gap:26px;margin:18px 0 6px">
      <div class="ring" style="--p:${sc}"><div><div class="scorebig">${sc}</div><div class="small muted">/ 100</div></div></div>
      <div class="grow" style="min-width:240px">
        <p style="font-size:16px">${verdict}</p>
        <div class="small muted">${DOMAINS[App.cfg.domain].icon} ${H(DOMAINS[App.cfg.domain].label)} · ${H(DIFFICULTY[App.cfg.difficulty].label)} · Target: ${H(plat)} · ${App.answers.length} questions</div>
      </div>
    </div>
    <div style="margin-top:14px">
      ${dims.map(n=>{const v=avgDim(n);return `<div class="dim"><div class="between row"><span class="small"><b>${n}</b></span><span class="small muted">${v}/100</span></div><div class="bar"><i style="width:${v}%;background:${barColor(v)}"></i></div></div>`;}).join("")}
    </div>
    <div class="row wrapw" style="margin-top:20px;gap:10px">
      <button class="btn primary" onclick="retry()">↻ Practice again</button>
      <button class="btn" onclick="window.print()">⬇ Save / print report</button>
      <button class="btn ghost" onclick="go('setup')">Change track</button>
    </div>
  </div>
  <div class="card">
    <h2>Question-by-question feedback</h2>
    ${App.answers.map((a,i)=>{const [k,l]=band(a.score);return `
      <div class="qresult">
        <div class="row between center"><div class="qmeta">Q${i+1} · ${a.seconds}s · ${a.wc} words</div><span class="badge ${k}">${a.score}/100 · ${l}</span></div>
        <div style="font-weight:600;margin:6px 0">${H(a.q)}</div>
        <div class="small muted" style="margin-bottom:8px"><b>Your answer:</b> ${H(a.answer)}</div>
        <div class="row wrapw small" style="gap:14px;margin-bottom:8px">${Object.entries(a.dims).map(([n,v])=>`<span class="muted">${n}: <b style="color:${barColor(v)}">${v}</b></span>`).join("")}</div>
        <div class="small"><b>How to improve:</b><ul class="tips">${a.feedback.map(t=>`<li>${H(t)}</li>`).join("")}</ul></div>
      </div>`;}).join("")}
  </div>
  <div class="card">
    <h3>How scoring works</h3>
    <p class="small muted">Each answer is scored 0–100 on four rubric dimensions — <b>Relevance</b> (did you cover what the question targets), <b>Depth</b> (substance and length), <b>Structure</b> (clear, signposted reasoning), and <b>Specificity</b> (examples, numbers, concrete detail). This mirrors how human and AI graders judge screening answers. It runs entirely in your browser; nothing is uploaded.</p>
  </div>`;
}

/* ---------- History ---------------------------------------------------------- */
function loadHistory(){ try{ return JSON.parse(localStorage.getItem("ia_history")||"[]"); }catch(e){ return []; } }
function saveHistory(){
  const h=loadHistory();
  h.unshift({ date:new Date().toLocaleString(), candidate:App.candidate.name, platform:App.candidate.platform,
    domain:DOMAINS[App.cfg.domain].label, score:overall(), answers:App.answers, cfg:App.cfg, candidateObj:App.candidate });
  try{ localStorage.setItem("ia_history", JSON.stringify(h.slice(0,10))); }catch(e){}
}
function showLast(){ const h=loadHistory(); if(!h.length) return;
  App.answers=h[0].answers; App.cfg=h[0].cfg; if(h[0].candidateObj) App.candidate=h[0].candidateObj; App.screen="results"; render(); }

/* ---------- Footer ----------------------------------------------------------- */
function renderFooter(){ document.getElementById("footer").innerHTML=
  `${H(BRAND.name)} — a free practice tool by ${H(BRAND.community)} for AI-data-work screening (Outlier · Mercor · Micro1 style). Runs entirely in your browser; we never see your audio or answers.`; }

/* ---------- Navigation ------------------------------------------------------- */
function go(s){ Speech.stop(); App.screen=s; render(); }
function setPlatform(k){ App.candidate.platform=k; render(); }
function setLevel(k){ App.candidate.level=k; App.cfg.difficulty=k; render(); }
function setDomain(k){ App.cfg.domain=k; render(); }
function setDiff(k){ App.cfg.difficulty=k; render(); }
function setCount(n){ App.cfg.count=n; render(); }
function setVoice(v){ App.cfg.voice=v && Speech.ttsAvailable; render(); }
function startInterview(){ buildQuestions(); App.idx=0; App.answers=[]; App.screen="interview"; render(); }
function retry(){ App.idx=0; App.answers=[]; buildQuestions(); App.screen="interview"; render(); }

Object.assign(window,{App,go,setPlatform,setLevel,setDomain,setDiff,setCount,setVoice,startInterview,
  toggleMic,repeatQ,showTyping,submitAnswer,quitConfirm,retry,showLast});

renderBrand(); renderFooter(); render();
</script>
</body>
</html>
